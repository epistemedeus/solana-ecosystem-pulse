name: Refresh Solana Ecosystem Pulse

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: solana-pulse-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and render
        run: python3 pulse.py

      - name: Verify
        run: python3 -m unittest -v

      - name: Commit refreshed artifacts
        run: |
          git config user.name "solana-pulse-bot"
          git config user.email "solana-pulse-bot@users.noreply.github.com"
          git add data/latest.json data/history.jsonl reports/latest.md dashboard/index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "data: refresh Solana ecosystem pulse [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4

